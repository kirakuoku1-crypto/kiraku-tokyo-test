name: Tokyo official data free test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-yutakaen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run one-facility test
        run: python test_tokyo.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-test-result
          path: |
            result.json
            feature_page.html
            detail_page.html
          if-no-files-found: ignore
