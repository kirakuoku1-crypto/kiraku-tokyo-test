name: Saitama 635 official vacancy waiting update

on:
  workflow_dispatch:
  schedule:
    # 05:30 JST every day = 20:30 UTC on the previous day
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: saitama-635-official-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Saitama 635 official vacancy and waiting data
        shell: bash
        run: |
          set -euo pipefail

          python update_saitama_635.py

          git add \
            docs/saitama_635_latest.json \
            docs/saitama_635_latest.csv \
            docs/saitama_635_classification.json \
            docs/saitama_635_classification.csv

          if git diff --cached --quiet; then
            echo "No Saitama data changes"
            exit 0
          fi

          git commit -m "Update Saitama official vacancy waiting data"

          for attempt in 1 2 3 4 5; do
            echo "git push attempt ${attempt}/5"
            if git push origin main; then
              exit 0
            fi
            echo "Push failed. Refreshing remote state before retry..."
            git pull --rebase origin main || {
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 10))
          done

          echo "git push failed after 5 attempts"
          exit 1

      - name: Upload latest result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saitama-635-latest
          path: |
            docs/saitama_635_latest.json
            docs/saitama_635_latest.csv
            docs/saitama_635_classification.json
            docs/saitama_635_classification.csv
          if-no-files-found: warn
          retention-days: 30
