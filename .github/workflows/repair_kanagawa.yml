name: Repair Kanagawa 649 updater

on:
  push:
    paths:
      - '.github/workflows/repair_kanagawa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch updater and validate syntax
        shell: bash
        run: |
          cat > /tmp/fix_kanagawa_649.py <<'KANAGAWA_REPAIR_SCRIPT'
          #!/usr/bin/env python3
          """In-repository, idempotent Kanagawa 649 repair. Never edits collected records."""
          from pathlib import Path
          
          PY_PATH = Path('update_kanagawa_649.py')
          WF_PATH = Path('.github/workflows/kanagawa.yaml')
          
          FETCH = '''def fetch_page(url: str, attempts: int = 3, retry_delays=None):
              """Retry temporary HTTP 5xx/429 errors; never retry permanent 404 responses."""
              last_error = ""
              delays = retry_delays if retry_delays is not None else (2, 5, 15)
              for attempt in range(1, attempts + 1):
                  retryable = True
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          status = getattr(resp, "status", resp.getcode())
                          body = resp.read()
                          source = decode_body(body, resp.headers.get("Content-Type", ""))
                          if status == 200 and source:
                              return status, source, ""
                          last_error = f"HTTP {status}" if status != 200 else "empty response"
                          retryable = status in (408, 429, 500, 502, 503, 504)
                  except urllib.error.HTTPError as e:
                      last_error = f"HTTP {e.code}"
                      retryable = e.code in (408, 429, 500, 502, 503, 504)
                  except urllib.error.URLError as e:
                      last_error = f"URL error: {e.reason}"
                  except Exception as e:
                      last_error = f"{type(e).__name__}: {e}"
          
                  if attempt >= attempts or not retryable:
                      break
                  pause = delays[min(attempt - 1, len(delays) - 1)]
                  print(f"Official source: {last_error}; retry {attempt + 1}/{attempts} in {pause}s", flush=True)
                  time.sleep(pause)
          
              return None, "", last_error
          '''
          
          PREFLIGHT = '''def preflight(facilities):
              """Probe up to 3 separate offices, not only the first office in the CSV."""
              checked = set()
              errors = []
              for fac in facilities:
                  for office_no in extract_office_numbers(fac.get("jigyosyo_cd")):
                      if office_no in checked:
                          continue
                      checked.add(office_no)
                      svc = service_cd_for(office_no, fac.get("service_cd", ""), fac.get("type", ""))
                      url = make_url(office_no, svc)
                      tries = 4 if len(checked) == 1 else 2
                      pauses = (15, 30, 60) if len(checked) == 1 else (5,)
                      status, source, err = fetch_page(url, attempts=tries, retry_delays=pauses)
                      if status == 200 and source:
                          text = html_to_text(source)
                          if "介護保険事業所番号" in text and office_no in text:
                              print(f"Preflight OK: {office_no}", flush=True)
                              return
                          err = "official detail page not recognized"
                      errors.append(f"office={office_no} status={status} error={err}")
                      print(f"Preflight failed: {errors[-1]}", flush=True)
                      if len(checked) >= 3:
                          raise RuntimeError(
                              "公式取得元の3事業所に接続できません。既存データを保持して終了: "
                              + " | ".join(errors)
                          )
              raise RuntimeError("公式取得元に接続できません。既存データを保持: " + " | ".join(errors))
          '''
          
          
          def replace_section(content, start, end, new_content):
              p = content.find(start)
              q = content.find(end, p + len(start))
              if p < 0 or q < 0:
                  raise RuntimeError(f'Missing expected Python section: {start} / {end}')
              return content[:p] + new_content + '\n\n' + content[q:]
          
          
          def main():
              original = PY_PATH.read_text(encoding='utf-8')
              py = replace_section(original, 'def fetch_page(', 'def parse_date_jp(', FETCH)
              py = replace_section(py, 'def preflight(', 'def main():', PREFLIGHT)
              if '    preserved = 0\n' not in py:
                  needle = '    batch_results = []\n'
                  if py.count(needle) != 1:
                      raise RuntimeError('Unexpected batch-results structure')
                  py = py.replace(needle, needle + '    preserved = 0\n', 1)
                  needle = '        records[r["no"]] = r\n'
                  if py.count(needle) != 1:
                      raise RuntimeError('Unexpected record write structure')
                  py = py.replace(needle, '''        previous = records.get(r["no"])
                  has_previous_public_value = previous is not None and any(
                      previous.get(field) is not None for field in ("vacancy", "waiting_count")
                  )
                  # Never replace previously obtained values with a source failure.
                  if has_previous_public_value and r["status"] in ("error", "ok_no_public_value"):
                      preserved += 1
                      print(f"Keep last known public values: No.{r['no']}", flush=True)
                  else:
                      records[r["no"]] = r
          ''', 1)
                  needle = '                "hard_errors": hard_errors,\n'
                  if py.count(needle) != 1:
                      raise RuntimeError('Unexpected summary structure')
                  py = py.replace(needle, needle + '                "preserved_previous": preserved,\n', 1)
          
              # Validate Python syntax before replacing either file.
              compile(py, str(PY_PATH), 'exec')
              y = WF_PATH.read_text(encoding='utf-8')
              dependency = '''      - name: Install Playwright
                  run: |
                    python -m pip install --upgrade pip
                    pip install playwright
                    playwright install --with-deps chromium
          
          '''
              if dependency in y:
                  y = y.replace(dependency, '', 1)
              elif '      - name: Install Playwright\n' in y:
                  raise RuntimeError('Unexpected Playwright installation block')
              y = y.replace('python update_kanagawa_649.py --start "$START" --count "$BATCH"',
                            'python -u update_kanagawa_649.py --start "$START" --count "$BATCH"')
              if 'python -u update_kanagawa_649.py --start "$START" --count "$BATCH"' not in y:
                  raise RuntimeError('Unexpected main execution command')
              if 'timeout-minutes: 180' not in y or 'contents: write' not in y:
                  raise RuntimeError('Existing GitHub workflow settings differ unexpectedly')
          
              PY_PATH.write_text(py, encoding='utf-8')
              WF_PATH.write_text(y, encoding='utf-8')
              print('Patched Python updater and kanagawa.yaml safely; official data untouched.')
          
          
          if __name__ == '__main__':
              main()
          KANAGAWA_REPAIR_SCRIPT
          python /tmp/fix_kanagawa_649.py
          python -m py_compile update_kanagawa_649.py
          git diff --check
      - name: Commit repair only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_kanagawa_649.py .github/workflows/kanagawa.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Repair Kanagawa 649 temporary HTTP errors and preserve data"
            git push origin HEAD:main
          else
            echo "Repair already installed; no change required."
          fi
