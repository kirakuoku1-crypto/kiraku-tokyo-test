name: Osaka 851 official vacancy waiting update

on:
  # When this workflow file is replaced after the first-run interruption,
  # resume automatically from No.601. Scheduled runs always refresh all 851.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update_osaka_851.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start facility number (1-851)'
        required: false
        default: '1'
  schedule:
    # 04:00 JST every day = 19:00 UTC on the previous day
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: osaka-851-official-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Osaka facilities in 50-facility checkpoints
        shell: bash
        run: |
          set -euo pipefail

          TOTAL=851
          BATCH=50

          if [ "${{ github.event_name }}" = "schedule" ]; then
            FIRST=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FIRST="${{ inputs.start }}"
          else
            # This replacement commit resumes the interrupted first run.
            FIRST=601
          fi

          if ! [[ "$FIRST" =~ ^[0-9]+$ ]] || [ "$FIRST" -lt 1 ] || [ "$FIRST" -gt "$TOTAL" ]; then
            echo "Invalid start value: $FIRST"
            exit 1
          fi

          push_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "git push attempt ${attempt}/5"
              if git push origin main; then
                return 0
              fi

              echo "Push failed. Refreshing remote state before retry..."
              git pull --rebase origin main || {
                echo "git pull --rebase failed"
                git rebase --abort || true
                return 1
              }
              sleep $((attempt * 10))
            done

            echo "git push failed after 5 attempts"
            return 1
          }

          for START in $(seq "$FIRST" $BATCH $TOTAL); do
            END=$((START + BATCH - 1))
            if [ "$END" -gt "$TOTAL" ]; then END=$TOTAL; fi

            echo "===== Osaka ${START}-${END} / ${TOTAL} ====="
            python update_osaka_851.py --start "$START" --count "$BATCH"

            git add docs/osaka_851_latest.json docs/osaka_851_latest.csv \
                    docs/osaka_851_classification.json docs/osaka_851_classification.csv

            if ! git diff --cached --quiet; then
              git commit -m "Update Osaka official data ${START}-${END}"
              push_with_retry
            fi
          done

      - name: Upload latest result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaka-851-latest
          path: |
            docs/osaka_851_latest.json
            docs/osaka_851_latest.csv
            docs/osaka_851_classification.json
            docs/osaka_851_classification.csv
          if-no-files-found: warn
          retention-days: 30
