name: Osaka 851 official vacancy waiting update

on:
  push:
    branches: [main]
    paths:
      - 'update_osaka_851.py'
      - '.github/workflows/update_osaka_851.yml'
  workflow_dispatch:
    inputs:
      only_unavailable:
        description: '取得不可だけ再確認する場合は true。全851件なら false'
        required: false
        default: 'true'
  schedule:
    # 04:00 # 04:45 JST every day = 19:45 UTC on the previous day
    - cron: '45 19 * * *'

permissions:
  contents: write

concurrency:
  group: osaka-851-official-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Osaka facilities in 50-facility checkpoints
        shell: bash
        run: |
          set -euo pipefail

          TOTAL=851
          BATCH=50
          ONLY_FLAG=""

          # A code/workflow replacement rechecks only the currently 取得不可 records.
          # Daily 04:00 runs continue to refresh all 851 facilities.
          if [ "${{ github.event_name }}" = "push" ]; then
            ONLY_FLAG="--only-unavailable"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.only_unavailable }}" = "true" ]; then
            ONLY_FLAG="--only-unavailable"
          fi

          push_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "git push attempt ${attempt}/5"
              if git push origin main; then
                return 0
              fi
              echo "Push failed. Refreshing remote state before retry..."
              git pull --rebase origin main || {
                echo "git pull --rebase failed"
                git rebase --abort || true
                return 1
              }
              sleep $((attempt * 10))
            done
            echo "git push failed after 5 attempts"
            return 1
          }

          for START in $(seq 1 $BATCH $TOTAL); do
            END=$((START + BATCH - 1))
            if [ "$END" -gt "$TOTAL" ]; then END=$TOTAL; fi

            echo "===== Osaka ${START}-${END} / ${TOTAL} ${ONLY_FLAG} ====="
            python update_osaka_851.py --start "$START" --count "$BATCH" $ONLY_FLAG

            git add docs/osaka_851_latest.json docs/osaka_851_latest.csv \
                    docs/osaka_851_classification.json docs/osaka_851_classification.csv

            if ! git diff --cached --quiet; then
              git commit -m "Recheck Osaka official data ${START}-${END}"
              push_with_retry
            fi
          done

      - name: Upload latest result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaka-851-latest
          path: |
            docs/osaka_851_latest.json
            docs/osaka_851_latest.csv
            docs/osaka_851_classification.json
            docs/osaka_851_classification.csv
          if-no-files-found: warn
          retention-days: 30
