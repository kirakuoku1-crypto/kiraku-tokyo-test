name: Osaka 851 official vacancy waiting update

on:
  # Initial deployment/update of the crawler starts a full 851-facility run automatically.
  push:
    branches: [main]
    paths:
      - 'osaka_851_facilities.csv'
      - 'update_osaka_851.py'
      - '.github/workflows/update_osaka_851.yml'
  workflow_dispatch:
  schedule:
    # 04:00 JST every day = 19:00 UTC on the previous day
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: osaka-851-official-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update 851 facilities in 50-facility checkpoints
        shell: bash
        run: |
          set -euo pipefail
          TOTAL=851
          BATCH=50
          for START in $(seq 1 $BATCH $TOTAL); do
            END=$((START + BATCH - 1))
            if [ "$END" -gt "$TOTAL" ]; then END=$TOTAL; fi
            echo "===== Osaka ${START}-${END} / ${TOTAL} ====="
            python update_osaka_851.py --start "$START" --count "$BATCH"

            git add docs/osaka_851_latest.json docs/osaka_851_latest.csv \
                    docs/osaka_851_classification.json docs/osaka_851_classification.csv
            if ! git diff --cached --quiet; then
              git commit -m "Update Osaka official data ${START}-${END}"
              git push
            fi
          done

      - name: Upload latest result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaka-851-latest
          path: |
            docs/osaka_851_latest.json
            docs/osaka_851_latest.csv
            docs/osaka_851_classification.json
            docs/osaka_851_classification.csv
          if-no-files-found: warn
          retention-days: 30
