name: Saitama 30 facilities daily official and portal review (read-only)

on:
  workflow_dispatch:
  schedule:
    # 08:00 JST = 23:00 UTC (schedules may start late)
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: kiraku-saitama-30-daily
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.53,<2'
          python -m playwright install --with-deps chromium
