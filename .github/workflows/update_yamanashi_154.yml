name: Yamanashi 154 official vacancy waiting update

on:
  push:
    branches: [main]
    paths:
      - 'update_yamanashi_154.py'
      - 'yamanashi_154_facilities.csv'
      - '.github/workflows/update_yamanashi_154.yml'
  workflow_dispatch:
  schedule:
    # 04:00 JST every day = 19:00 UTC on the previous day
    - cron: "0 19 * * *"

permissions:
  contents: write

concurrency:
  group: yamanashi-154-official-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update all 154 facilities in 50-facility checkpoints
        shell: bash
        run: |
          set -euo pipefail
          TOTAL=154
          BATCH=50
          push_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "git push attempt ${attempt}/5"
              if git push origin main; then return 0; fi
              git pull --rebase origin main || { git rebase --abort || true; return 1; }
              sleep $((attempt * 10))
            done
            return 1
          }
          for START in $(seq 1 $BATCH $TOTAL); do
            END=$((START + BATCH - 1)); if [ "$END" -gt "$TOTAL" ]; then END=$TOTAL; fi
            echo "===== Yamanashi ${START}-${END} / ${TOTAL} ====="
            python update_yamanashi_154.py --start "$START" --count "$BATCH"
            git add docs/yamanashi_154_latest.json docs/yamanashi_154_latest.csv
            if ! git diff --cached --quiet; then
              git commit -m "Update Yamanashi official data ${START}-${END}"
              push_with_retry
            fi
          done

      - name: Upload latest result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yamanashi-154-latest
          path: |
            docs/yamanashi_154_latest.json
            docs/yamanashi_154_latest.csv
          if-no-files-found: warn
          retention-days: 30
