name: Saitama 20 facilities screenshot pilot (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saitama-2040-screenpilot-manual
  cancel-in-progress: false

jobs:
  screenshot-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.53,<2'
          python -m playwright install --with-deps chromium

      - name: Screenshot 20 public facility pages without changing application data
        shell: bash
        run: |
          mkdir -p pilot
