          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """埼玉県20施設：公開ページの表示を撮影し、空室情報の変更候補だけを保存する。

          重要：スプレッドシート、GAS、Netlifyへの書き込みは一切しない。
          Google検索は使わず、targets_20.jsonの確認済みURLにだけアクセスする。
          """
          import argparse
          import base64
          import csv
          from datetime import datetime, date, timedelta
          import json
          import os
          from pathlib import Path
          import re
          import time
          import unicodedata
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          JST = ZoneInfo('Asia/Tokyo')
          ALLOWED_HOSTS = ('www.minnanokaigo.com', 'minnanokaigo.com')


          def norm(s):
              s = unicodedata.normalize('NFKC', str(s or '')).lower()
              s = re.sub(r'(?:介護付き?有料老人ホーム|住宅型有料老人ホーム|有料老人ホーム|サービス付き高齢者向け住宅)', '', s)
              return re.sub(r'[\s　・･\-‐‑–—―ー~〜～_／/()（）\[\]【】「」『』:：,.，。]', '', s)


          def name_match(target, header):
              a, b = norm(target), norm(header)
              return len(a) >= 4 and a in b


          def dated_context(s, today=None):
              today = today or datetime.now(JST).date()
              for regex in (r'(?<!\d)(20\d{2})[年/\-.](\d{1,2})[月/\-.](\d{1,2})日?\s*(?:更新|現在|時点)',
                            r'(?<!\d)(\d{1,2})月(\d{1,2})日\s*更新',
                            r'(?<!\d)(\d{1,2})/(\d{1,2})\s*更新'):
                  m = re.search(regex, s)
                  if not m: continue
                  try:
                      if len(m.groups()) == 3:
                          yy,mm,dd = map(int,m.groups()); d=date(yy,mm,dd)
                      else:
                          mm,dd = map(int,m.groups()); d=date(today.year,mm,dd)
                          if d > today + timedelta(days=2): d=date(today.year-1,mm,dd)
                      return m.group(0), (today-d).days
                  except ValueError:
                      pass
              return '',None


          def extract_visible(target_name, headings, text, source):
              """掲載ページの先頭の空室欄だけを解析。関連施設の情報を拾わない保守的判定。"""
              out={'page_name_match':False,'observed_status':'unknown','observed_rooms':'',
                   'source_date':'','age_days':None,'reason':'','excerpt':''}
              # H1が空白/一般的な社名なら推測しない。複数施設を混同しない。
              out['page_name_match']=any(name_match(target_name,h) for h in headings[:5])
              if not out['page_name_match']:
                  out['reason']='ページ見出しと施設名が一致しない（別施設の誤取得防止）'
                  return out
              t=(text or '')[:26000]
              # ページ本文にある「おすすめ施設」「周辺施設」の空室を誤読しないよう先頭の空室欄だけ
              pos=t.find('空室の状況')
              if pos<0: pos=t.find('空室状況')
              if pos<0:
                  m=re.search(r'(?:1人\s*部屋|居室)\s*(?:残り\s*\d+\s*室|満室)',t[:4200])
                  pos=max(0,(m.start()-80)) if m else -1
              if pos<0:
                  out['reason']='ページ先頭に空室情報欄なし（本文全体から推測しない）'
                  return out
              # 文脈を短く取り、関連施設一覧を拾わない
              snippet=t[pos:pos+680]
              for stopper in ['おすすめの施設','近隣の施設','「満室で入れない」という方に','口コミご紹介','すべての口コミ']:
                  pp=snippet.find(stopper)
                  if pp>=0: snippet=snippet[:pp]
              out['excerpt']=' '.join(snippet.split())[:350]
              flat=' '.join(snippet.split())
              avail=re.findall(r'(?:残り|空室(?:数)?|空き|残室)\s*[:：]?\s*([1-9]\d*)\s*(?:室|部屋|戸)', flat)
              positive=bool(avail or re.search(r'空室\s*(?:あり|有り)|空き\s*(?:あり|有り)|残りわずか|空室わずか',flat))
              full=bool(re.search(r'満室|満床|空室なし|空きなし|残室なし|空室\s*0\s*室',flat))
              if positive:
                  out['observed_status']='available';out['observed_rooms']=str(max(map(int,avail))) if avail else ''
              elif full:
                  out['observed_status']='full';out['observed_rooms']='0'
              else:
                  out['reason']='空室欄内で明確な数・満室を判定できず'
              # 日付も空室欄の近傍だけから読む
              ds,age=dated_context(snippet)
              out['source_date'],out['age_days']=ds,age
              if out['observed_status']!='unknown':
                  if age is None: out['reason']='掲載更新日未確認のため参考候補（要電話確認）'
                  elif age>21: out['reason']='掲載更新日が21日超のため参考候補（要電話確認）'
                  elif age<0: out['reason']='掲載日が未来日。要確認'
                  else: out['reason']='画面上の情報から確認候補を抽出（実際の空室保証なし）'
              return out


          def vision_from_screenshot(img_paths, target, enabled):
              return {'vision_status':'not_run','vision_result':'画像はGitHub Artifactsに保存。AI画像判定はこの初回試験では未使用'}


          def run(args):
              from playwright.sync_api import sync_playwright
              targets=json.loads(Path(args.targets).read_text(encoding='utf-8'))[:20]
              outdir=Path(args.output);outdir.mkdir(parents=True,exist_ok=True)
              image_dir=outdir/'screenshots';image_dir.mkdir(exist_ok=True)
              results=[]
              with sync_playwright() as p:
                  opts={'headless':True}
                  if args.chromium_path:opts['executable_path']=args.chromium_path
                  browser=p.chromium.launch(**opts)
                  ctx=browser.new_context(viewport={'width':1350,'height':1000},
                                            device_scale_factor=1,locale='ja-JP',timezone_id='Asia/Tokyo')
                  for i,t in enumerate(targets,1):
                      entry={'no':i,'id':t['id'],'name':t['name'],'region':t['region'],'source':t['source'],
                             'url':t['url'],'checked_at':datetime.now(JST).isoformat(timespec='seconds'),
                             'http_code':'','page_title':'','name_match':'','observed_status':'unknown',
                             'rooms':'','source_date':'','age_days':'','reason':'','screenshot_top':'','screenshot':'','vision_status':'not_run',
                             'vision_result':'','proposal_only':True}
                      url=t.get('url') or ''
                      if t.get('decision')=='manual_only' or not url:
                          entry['reason']='統合施設・曖昧な施設名のため自動取得を見送り';results.append(entry);continue
                      parsed=urlsplit(url)
                      if parsed.scheme!='https' or not parsed.hostname or parsed.hostname.startswith('localhost'):
                          entry['reason']='URLの安全確認で見送り';results.append(entry);continue
                      page=ctx.new_page()
                      try:
                          resp=page.goto(url,wait_until='domcontentloaded',timeout=args.timeout*1000)
                          entry['http_code']=resp.status if resp else 'no response'
                          page.wait_for_timeout(1000)
                          entry['page_title']=page.title()[:180]
                          # アクセス制限、ログイン、HTTP失敗時は要確認で保存
                          if resp and resp.status>=400:
                              entry['reason']=f'HTTP {resp.status}（取得できず）'
                          else:
                              headings=page.locator('h1').all_inner_texts()
                              if not headings: headings=[entry['page_title']]
                              body=page.locator('body').inner_text(timeout=8000)
                              if re.search(r'captcha|access denied|request blocked|ロボットではありません|アクセスが制限',body[:2500],re.I):
                                  e={'page_name_match':False,'observed_status':'unknown','observed_rooms':'','source_date':'','age_days':None,'reason':'アクセス制限または認証画面の可能性','excerpt':''}
                              else:
                                  e=extract_visible(t['name'],headings,body,t['source'])
                              entry.update({'name_match':e['page_name_match'],'observed_status':e['observed_status'],
                                            'rooms':e['observed_rooms'],'source_date':e['source_date'],
                                            'age_days':e['age_days'] if e['age_days'] is not None else '',
                                            'reason':e['reason']})
                              # 公開情報の一部だけ監査用に保存。非公開シートには書き込まない
                              if e['page_name_match']:
                                  (outdir/(t['id']+'_visible_excerpt.txt')).write_text(e['excerpt'],encoding='utf-8')
                          # 空室欄にスクロールする前にページ上部も撮影する。
                          top=image_dir/(f'{i:02d}_{t["id"]}_top.png')
                          page.screenshot(path=str(top),full_page=False,timeout=8000)
                          entry['screenshot_top']=str(top.relative_to(outdir))
                          # 空室欄が見える位置を撮影（写真や推薦欄の無関係な情報は判定しない）
                          for selector in ('text=空室の状況','text=空室状況'):
                              try:
                                  loc=page.get_by_text(selector.split('=',1)[1],exact=False).first
                                  if loc.count():loc.scroll_into_view_if_needed(timeout=2500);break
                              except Exception:pass
                          im=image_dir/(f'{i:02d}_{t["id"]}_vacancy.png')
                          page.screenshot(path=str(im),full_page=False,timeout=8000)
                          entry['screenshot']=str(im.relative_to(outdir))
                          vr=vision_from_screenshot([top,im],t,args.vision)
                          entry.update(vr)
                          if vr['vision_status']=='ok':
                              v=vr['vision_result']
                              if v.get('name_matched') is False:
                                  entry['reason']+='／画像AIは施設名の一致を確認できず'
                          print(f'{i:02}/{len(targets)} {t["name"]}: HTTP={entry["http_code"]} 判定={entry["observed_status"]}')
                      except Exception as e:
                          entry['reason']='表示エラー: '+str(e).replace('\n',' ')[:150]
                          print(f'{i:02}/{len(targets)} {t["name"]}: ERR {entry["reason"]}')
                      finally:
                          results.append(entry)
                          page.close()
                          if i<len(targets): time.sleep(max(0,args.delay))
                  browser.close()
              (outdir/'results_20.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              columns=['no','id','name','source','url','http_code','name_match','observed_status','rooms',
                       'source_date','age_days','reason','screenshot_top','screenshot','vision_status','vision_result','checked_at','proposal_only']
              with (outdir/'results_20.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='ignore');w.writeheader();w.writerows(results)
              ok=sum(1 for x in results if x['observed_status'] in ('available','full'))
              fetched=sum(1 for x in results if x['http_code']==200)
              lines=['# 埼玉県20施設・画面撮影パイロット結果','',
                     f'実行：{datetime.now(JST).strftime("%Y-%m-%d %H:%M JST")}',
                     f'20件中 HTTP200: {fetched}件 / 判定候補: {ok}件',
                     '**本番データへの書き込みなし。空室は確定情報ではありません。**','',
                     '| ID | 施設名 | 取得元 | HTTP | 文字判定 | AI画像判定 | 掲載日 | 状況 |',
                     '|---|---|---|---|---|---|---|---|']
              for t in results:
                  reason=str(t['reason']).replace('|','／')[:65]
                  ai=t['vision_result'] if isinstance(t['vision_result'],dict) else {}
                  ai_status=ai.get('status','未実施')
                  lines.append(f'| {t["id"]} | {t["name"]} | {t["source"]} | {t["http_code"]} | {t["observed_status"]} {t["rooms"]} | {ai_status} | {t["source_date"]} | {reason} |')
              lines.extend(['','※ 開けなかったサイトは推測せず要確認。撮影結果は screenshots/ に保存。',
                            '※ 掲載日が21日超、または記載がない場合は参考候補・要電話確認。',
                            '※ 既存の空室件数（135件など）を自動上書きしない。'])
              (outdir/'report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
              print(f'\n完了: {len(results)}件 / HTTP200={fetched}件 / 自動判定候補={ok}件。保存先 {outdir}')


          if __name__=='__main__':
              parser=argparse.ArgumentParser()
              parser.add_argument('--targets',default='targets_20.json')
              parser.add_argument('--output',default='pilot_result')
              parser.add_argument('--timeout',type=int,default=28)
              parser.add_argument('--delay',type=float,default=3.0)
              parser.add_argument('--chromium-path',default='')
              parser.add_argument('--vision',action='store_true',help='初回試験はAI画像判定なし（撮影のみ）')
              run(parser.parse_args())
          KIRAKU_PYTHON_END
                    cd pilot
                    python pilot.py --timeout 25 --delay 3

